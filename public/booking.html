<!doctype html>
<html lang="nl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clearview Autoglas — Afspraak maken</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
  <style>
    :root { --brand: #E60F04; --brand-dark: #9B0B03; }
    .brand-bg { background: var(--brand); color: #fff; }
    .brand-text { color: var(--brand); }
    .btn-brand { background: var(--brand); border-color: var(--brand); color: #fff; }
    .btn-brand:hover { background: var(--brand-dark); border-color: var(--brand-dark); }
    .pick { transition: border-color .15s, box-shadow .15s; cursor: pointer; }
    .pick:hover { border-color: var(--brand); }
    .pick.sel { border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
    .plate { background: #fff; border: 2px solid #111; border-radius: 6px; font: 700 1.6rem/1 ui-monospace, monospace; letter-spacing: .1em; text-align: center; }
    .steps .step-error::after { background: var(--brand) !important; color: #fff !important; }
    .steps .step-error::before { background: var(--brand) !important; }
    #log { max-height: 30rem; overflow: auto; }
    .log-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body class="bg-base-200 text-base-content">
  <header class="brand-bg">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-5 py-3">
      <a href="/" class="text-2xl font-black tracking-tight">Clearview <span class="font-light">Autoglas</span></a>
      <nav class="flex flex-wrap items-center gap-2 text-sm">
        <a href="/manage" id="nav-manage" class="btn btn-sm btn-ghost text-white"></a>
        <a href="/bookings" id="nav-bookings" class="btn btn-sm btn-ghost text-white"></a>
        <span id="langs" class="flex gap-1"></span>
      </nav>
    </div>
  </header>

  <section class="brand-bg pb-8 pt-2">
    <div class="mx-auto max-w-6xl px-5">
      <h1 id="hero-title" class="text-3xl font-black sm:text-5xl"></h1>
      <p id="hero-text" class="mt-3 max-w-2xl opacity-90"></p>
      <ul id="usp" class="mt-5 grid gap-2 text-sm font-medium sm:grid-cols-2 lg:grid-cols-4"></ul>
      <p id="demo" class="mt-5 text-xs opacity-70"></p>
    </div>
  </section>

  <main class="mx-auto grid max-w-6xl gap-6 px-5 py-8 lg:grid-cols-[1fr_22rem]">
    <section class="min-w-0">
      <ul id="steps" class="steps mb-6 w-full text-xs"></ul>
      <div id="panel" class="rounded-box bg-base-100 p-6 shadow"></div>
      <div id="nav" class="mt-4 flex justify-between"></div>
    </section>
    <aside class="min-w-0 space-y-4">
      <div class="rounded-box bg-base-100 p-5 shadow"><h2 id="summary-title" class="font-bold"></h2><div id="summary" class="mt-3 text-sm"></div></div>
      <div class="rounded-box bg-neutral p-4 text-neutral-content">
        <div class="flex items-center justify-between"><h2 id="log-title" class="font-bold"></h2><button id="clear-log" class="btn btn-ghost btn-xs"></button></div>
        <p id="log-note" class="mt-1 text-xs opacity-60"></p>
        <div id="log" class="mt-3 space-y-2 text-xs"></div>
      </div>
    </aside>
  </main>

  <script src="/i18n.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    let step = 0, session = null, services = [], locations = [], days = [], done = null, busy = false;

    async function api(method, url, body) {
      const res = await fetch(url, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json();
      const el = document.createElement("details");
      el.className = "rounded bg-black/30 p-2";
      el.innerHTML = `<summary class="cursor-pointer font-mono"><span class="text-warning">${method}</span> ${esc(url)} <span class="${res.status < 400 ? "text-success" : "text-error"}">${res.status}</span></summary>` +
        (body ? `<p class="mt-2 opacity-60">request</p><pre class="log-body">${esc(JSON.stringify(body, null, 2))}</pre>` : "") +
        `<p class="mt-2 opacity-60">response</p><pre class="log-body">${esc(JSON.stringify(data, null, 2))}</pre>`;
      $("log").prepend(el);
      return { ok: res.ok, status: res.status, data };
    }

    async function update(patch) {
      patch = { ...patch, language: LANG };
      if (!session) session = (await api("POST", "/api/booking-sessions", patch)).data;
      else {
        const r = await api("PUT", `/api/booking-sessions/${session.id}`, patch);
        if (r.ok) session = r.data;
      }
      renderSummary();
    }

    const svcText = (s) => ({ title: T().svc[s.id]?.[0] || s.title, description: T().svc[s.id]?.[1] || s.description });
    const svcById = (id) => services.find((s) => s.id === id);
    const total = (k) => session?.totals.find((x) => x.type === k)?.amount ?? 0;
    const has = (...codes) => (session?.messages || []).some((m) => codes.includes(m.code));
    const errorBox = (...codes) => (session?.messages || []).filter((m) => m.type === "error" && codes.includes(m.code)).map((m) => `<div class="alert alert-error mt-3 py-2 text-sm">${esc(T().msg[m.code] || m.content)}</div>`).join("");
    const locText = (l) => l.mobile ? { title: t("homeTitle"), address: t("homeAddr") } : { title: l.title, address: l.address };

    function renderChrome() {
      $("nav-manage").textContent = t("manage");
      $("nav-bookings").textContent = t("bookings");
      $("langs").innerHTML = langSwitcher();
      $("hero-title").innerHTML = t("heroTitle");
      $("hero-text").textContent = t("heroText");
      $("usp").innerHTML = T().usp.map((u) => `<li class="flex items-center gap-2"><span>✔︎</span>${esc(u)}</li>`).join("");
      $("demo").textContent = t("demo");
      $("summary-title").textContent = t("summary");
      $("log-title").textContent = t("log"); $("log-note").textContent = t("logNote"); $("clear-log").textContent = t("clear");
      document.title = `Clearview Autoglas — ${t("bookNow")}`;
    }

    function renderSummary() {
      if (done) { $("summary").innerHTML = `<p class="opacity-60">${esc(t("booked"))}</p>`; return; }
      if (!session) { $("summary").innerHTML = `<p class="opacity-60">${esc(t("nothing"))}</p>`; return; }
      const row = (k, v) => v ? `<div class="flex justify-between gap-3 py-1"><dt class="opacity-60">${esc(k)}</dt><dd class="text-right font-medium">${esc(v)}</dd></div>` : "";
      const svc = session.service && svcText(session.service);
      const loc = session.location && locations.find((l) => l.id === session.location.id);
      $("summary").innerHTML = `<dl>${row(t("service"), svc?.title)}${row(t("plate"), session.vehicle?.plate)}${row(t("where"), loc && locText(loc).title)}${row(t("when"), session.slot && `${dateLabel(session.slot.date)} ${session.slot.time}`)}</dl>
        ${session.service && session.insurance ? `<div class="mt-3 border-t border-base-content/10 pt-3">
          ${session.insurance.claim ? `<div class="flex justify-between"><span>${esc(t("insurerBilled"))}</span><b>${money(total("billed_to_insurer"))}</b></div><div class="flex justify-between text-xs opacity-60"><span>${esc(t("totalVat"))}</span><span>${money(0)}</span></div>`
          : `<div class="flex justify-between"><span>${esc(t("totalVat"))}</span><b>${money(total("total"))}</b></div><div class="flex justify-between text-xs opacity-60"><span>${esc(t("deposit"))}</span><span>${money(total("deposit_due_now"))}</span></div>`}</div>` : ""}`;
    }

    function renderNav() {
      if (done) { $("nav").innerHTML = ""; return; }
      const ready = [session?.service, session?.vehicle?.plate && !has("invalid_plate", "missing_insurance", "missing_insurer"), session?.location && !has("not_mobile"), session?.slot && !has("invalid_slot", "slot_taken")][step];
      $("nav").innerHTML = `<button class="btn btn-ghost" id="back" ${step === 0 ? "disabled" : ""}>${esc(t("back"))}</button>` + (step < 4 ? `<button class="btn btn-brand" id="next" ${ready ? "" : "disabled"}>${esc(t("next"))}</button>` : "");
    }

    function renderPanel() {
      $("steps").innerHTML = T().steps.map((s, i) => `<li class="step ${i <= step ? "step-error" : ""}">${esc(s)}</li>`).join("");
      renderNav();
      const p = $("panel");
      if (done) {
        const svc = svcText(done.service);
        p.innerHTML = `<div class="text-center"><div class="text-5xl">✅</div><h2 class="mt-2 text-2xl font-black">${esc(t("booked"))}</h2>
          <p class="mt-1 opacity-70">${esc(t("ref"))} <b class="brand-text">${esc(done.reference)}</b> · ${esc(done.vehicle.plate)}</p></div>
          <dl class="mx-auto mt-5 max-w-sm space-y-1 text-sm">
            <div class="flex justify-between"><dt>${esc(t("service"))}</dt><dd class="text-right">${esc(svc.title)}</dd></div>
            <div class="flex justify-between"><dt>${esc(t("where"))}</dt><dd class="text-right">${esc(done.location.id === "home" ? t("homeTitle") : done.location.title)}</dd></div>
            <div class="flex justify-between"><dt>${esc(t("when"))}</dt><dd>${esc(dateLabel(done.slot.date))} ${esc(done.slot.time)}</dd></div>
            ${done.insurance.claim ? `<div class="flex justify-between"><dt>${esc(t("insurerBilled"))}</dt><dd>${esc(done.insurance.company)}</dd></div><p class="pt-2 text-center">${esc(t("insuredNothing"))}</p>`
            : `<div class="flex justify-between"><dt>${esc(t("paidDeposit"))}</dt><dd>${money(done.deposit_paid.amount)}</dd></div><div class="flex justify-between font-bold"><dt>${esc(t("balance"))}</dt><dd>${money(done.balance_due.amount)}</dd></div>`}</dl>
          <div class="mt-6 flex justify-center gap-2"><a class="btn btn-outline btn-sm" href="/manage">${esc(t("manageLink"))}</a><button id="again" class="btn btn-brand btn-sm">${esc(t("again"))}</button></div>`;
        return;
      }
      if (step === 0) {
        p.innerHTML = `<h2 class="text-xl font-bold">${esc(t("whatFix"))}</h2><div class="mt-4 grid gap-3 sm:grid-cols-2">${services.map((s) => { const x = svcText(s); return `
          <div class="pick rounded-box border border-base-content/15 p-4 ${session?.service?.id === s.id ? "sel" : ""}" data-service="${s.id}">
            <b>${esc(x.title)}</b><p class="mt-1 text-sm opacity-70">${esc(x.description)}</p>
            <p class="mt-2 text-xs opacity-60">${esc(t("chipMin", { x: s.duration_min }))}${s.walk_in ? " · " + esc(t("walkIn")) : ""}${s.mobile_possible ? " · " + esc(t("mobile")) : ""}</p></div>`; }).join("")}</div>`;
      } else if (step === 1) {
        const ins = session?.insurance;
        p.innerHTML = `<h2 class="text-xl font-bold">${esc(t("yourVehicle"))}</h2>
          <label class="mt-4 block text-sm font-medium">${esc(t("plate"))}</label>
          <input id="plate" class="plate mt-1 w-56 p-2" placeholder="1-ABC-123" maxlength="12" value="${esc(session?.vehicle?.plate)}">
          <div id="plate-error">${errorBox("invalid_plate")}</div>
          <h3 class="mt-6 font-bold">${esc(t("insuredQ"))}</h3>
          <div class="mt-2 grid gap-3 sm:grid-cols-2">
            <div class="pick rounded-box border border-base-content/15 p-3 ${ins?.claim === true ? "sel" : ""}" data-ins="yes"><b>${esc(t("insYes"))}</b><p class="mt-1 text-xs opacity-70">${esc(t("insYesNote"))}</p></div>
            <div class="pick rounded-box border border-base-content/15 p-3 ${ins && !ins.claim ? "sel" : ""}" data-ins="no"><b>${esc(t("insNo"))}</b><p class="mt-1 text-xs opacity-70">${esc(t("insNoNote"))}</p></div></div>
          <input id="insurer" class="input input-bordered input-sm mt-3 w-full max-w-sm ${ins?.claim ? "" : "hidden"}" placeholder="${esc(t("insurer"))}" value="${esc(ins?.company)}">`;
      } else if (step === 2) {
        const groups = [...new Set(locations.map((l) => l.province))];
        p.innerHTML = `<h2 class="text-xl font-bold">${esc(t("whereQ"))}</h2>${groups.map((g) => `
          <h3 class="mt-5 text-sm font-bold uppercase tracking-wide opacity-60">${esc(T().provinces[g] || g)}</h3>
          <div class="mt-2 grid gap-3 sm:grid-cols-2">${locations.filter((l) => l.province === g).map((l) => { const x = locText(l); return `
            <div class="pick rounded-box border border-base-content/15 p-4 ${session?.location?.id === l.id ? "sel" : ""}" data-location="${l.id}"><b>${esc(x.title)}</b><p class="mt-1 text-sm opacity-70">${esc(x.address)}</p></div>`; }).join("")}</div>`).join("")}${errorBox("not_mobile")}`;
      } else if (step === 3) {
        p.innerHTML = `<h2 class="text-xl font-bold">${esc(t("pickSlot"))}</h2><div class="mt-4 space-y-3">${days.map((d) => `
          <div class="flex flex-wrap items-center gap-2"><span class="w-28 text-sm font-medium">${esc(dateLabel(d.date))}</span>
          ${d.times.map((x) => `<button class="btn btn-sm ${session?.slot?.date === d.date && session?.slot?.time === x.time ? "btn-brand" : "btn-outline"}" data-date="${d.date}" data-time="${x.time}" ${x.available ? "" : "disabled"}>${x.time}</button>`).join("")}</div>`).join("")}</div>${errorBox("invalid_slot", "slot_taken")}`;
      } else {
        const c = session?.contact || {};
        const pay = total("deposit_due_now") > 0;
        p.innerHTML = `<h2 class="text-xl font-bold">${esc(t("confirmPay"))}</h2>
          <form id="confirm" class="mt-4 grid gap-3 sm:grid-cols-2">
            <input name="name" class="input input-bordered" placeholder="${esc(t("name"))}" value="${esc(c.name)}" required>
            <input name="phone" class="input input-bordered" placeholder="${esc(t("phone"))}" value="${esc(c.phone)}" required>
            <input name="email" type="email" class="input input-bordered sm:col-span-2" placeholder="${esc(t("email"))}" value="${esc(c.email)}" required>
            ${pay ? `<select name="token" class="select select-bordered sm:col-span-2"><option value="tok_success">${esc(t("payOk"))}</option><option value="tok_declined">${esc(t("payNo"))}</option></select>` : `<p class="sm:col-span-2 text-sm">${esc(t("insuredNothing"))}</p>`}
            <button class="btn btn-brand sm:col-span-2" ${busy ? "disabled" : ""}>${esc(pay ? t("payBtn", { x: money(total("deposit_due_now")) }) : t("confirmBtn"))}</button>
          </form>${errorBox("invalid_email", "slot_taken", "not_mobile", "invalid_plate")}<p id="pay-error" class="mt-2 text-sm text-error"></p>
          ${pay ? `<p class="mt-3 text-xs opacity-60">${esc(t("payLater"))}</p>` : ""}`;
      }
    }

    function rerender() { renderChrome(); renderSummary(); renderPanel(); }
    async function loadDays() { days = (await api("GET", `/api/availability?location=${session.location.id}`)).data.days; }

    document.addEventListener("click", async (e) => {
      const el = e.target.closest("[data-lang],[data-service],[data-ins],[data-location],[data-date],button");
      if (!el) return;
      if (el.dataset.lang) { setLang(el.dataset.lang); if (session) await update({}); return rerender(); }
      if (el.dataset.service) await update({ service_id: el.dataset.service });
      else if (el.dataset.ins) await update({ insurance: { claim: el.dataset.ins === "yes", company: $("insurer")?.value || "" } });
      else if (el.dataset.location) await update({ location_id: el.dataset.location });
      else if (el.dataset.date) await update({ slot: { date: el.dataset.date, time: el.dataset.time } });
      else if (el.id === "next") { step++; if (step === 3) await loadDays(); }
      else if (el.id === "back") { step--; if (step === 3) await loadDays(); }
      else if (el.id === "again") { done = null; session = null; step = 0; renderSummary(); }
      else return;
      renderPanel();
    });

    document.addEventListener("input", (e) => {
      if (e.target.id === "plate") {
        clearTimeout(window.plateTimer);
        window.plateTimer = setTimeout(async () => { await update({ vehicle: { plate: e.target.value } }); renderNav(); $("plate-error").innerHTML = errorBox("invalid_plate"); }, 350);
      } else if (e.target.id === "insurer") {
        clearTimeout(window.insTimer);
        window.insTimer = setTimeout(async () => { await update({ insurance: { claim: true, company: e.target.value } }); renderNav(); }, 350);
      }
    });

    document.addEventListener("submit", async (e) => {
      if (e.target.id !== "confirm") return;
      e.preventDefault();
      const d = Object.fromEntries(new FormData(e.target));
      busy = true;
      await update({ contact: { name: d.name, phone: d.phone, email: d.email } });
      if (session.status === "ready_for_complete") {
        const r = await api("POST", `/api/booking-sessions/${session.id}/complete`, d.token ? { payment: { handler_id: "mock_pay", token: d.token } } : {});
        busy = false;
        if (r.ok) { done = r.data.booking; renderSummary(); renderPanel(); return; }
        renderPanel(); $("pay-error").textContent = r.data.error.message; return;
      }
      busy = false; renderPanel();
    });

    $("clear-log").addEventListener("click", () => ($("log").innerHTML = ""));
    (async () => {
      setLang(LANG);
      renderChrome();
      await api("GET", "/.well-known/ucp");
      services = (await api("GET", "/api/services")).data.services;
      locations = (await api("GET", "/api/locations")).data.locations;
      renderSummary(); renderPanel();
    })();
  </script>
</body>
</html>
