<!doctype html>
<html lang="en" data-theme="luxury">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page &amp; Co. Books — UCP demo store</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/daisyui.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/daisyui@5.5.19/themes.css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.2.4/dist/index.global.js"></script>
  <style>
    .cover { aspect-ratio: 3/4; }
    #log { max-height: 26rem; overflow: auto; }
    .log-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body class="bg-base-300 text-base-content">
  <div class="navbar bg-base-200 px-5 shadow">
    <div class="flex-1"><span class="text-xl font-black">📚 Page &amp; Co. Books</span><span class="badge badge-outline badge-primary ml-3">UCP demo · no real payments</span></div>
    <button id="open-cart" class="btn btn-primary btn-sm">Cart (<span id="cart-count">0</span>)</button>
  </div>

  <main class="mx-auto grid max-w-7xl gap-6 p-5 lg:grid-cols-[1fr_24rem]">
    <section>
      <input id="search" type="search" placeholder="Search title, author or genre…" class="input input-bordered mb-5 w-full">
      <div id="books" class="grid grid-cols-2 gap-4 md:grid-cols-3 xl:grid-cols-4"></div>
    </section>

    <aside class="min-w-0">
      <div class="rounded-box bg-neutral p-4 text-neutral-content">
        <div class="flex items-center justify-between"><h2 class="font-bold">Protocol log</h2><button id="clear-log" class="btn btn-ghost btn-xs">clear</button></div>
        <p class="mt-1 text-xs opacity-60">Every action in this store is a UCP-style API call. Click an entry to expand.</p>
        <div id="log" class="mt-3 space-y-2 text-xs"></div>
      </div>
    </aside>
  </main>

  <dialog id="cart-modal" class="modal">
    <div class="modal-box max-w-2xl">
      <h3 class="text-lg font-bold">Your order</h3>
      <div id="cart-body" class="mt-4"></div>
      <div class="modal-action"><form method="dialog"><button class="btn btn-ghost">Close</button></form></div>
    </div>
    <form method="dialog" class="modal-backdrop"><button>close</button></form>
  </dialog>

  <script>
    const money = (c) => `$${(c / 100).toFixed(2)}`;
    const $ = (id) => document.getElementById(id);
    const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    let session = null;
    let items = [];
    let last = null;

    async function api(method, url, body) {
      const res = await fetch(url, { method, headers: { "content-type": "application/json" }, body: body ? JSON.stringify(body) : undefined });
      const data = await res.json();
      logCall(method, url, body, res.status, data);
      return { ok: res.ok, status: res.status, data };
    }

    function logCall(method, url, req, status, res) {
      const el = document.createElement("details");
      el.className = "rounded bg-black/30 p-2";
      el.innerHTML = `<summary class="cursor-pointer font-mono"><span class="text-primary">${method}</span> ${esc(url)} <span class="${status < 400 ? "text-success" : "text-error"}">${status}</span></summary>` +
        (req ? `<p class="mt-2 opacity-60">request</p><pre class="log-body">${esc(JSON.stringify(req, null, 2))}</pre>` : "") +
        `<p class="mt-2 opacity-60">response</p><pre class="log-body">${esc(JSON.stringify(res, null, 2))}</pre>`;
      $("log").prepend(el);
    }

    async function loadBooks() {
      const q = $("search").value.trim();
      const { data } = await api("GET", "/api/catalog" + (q ? `?q=${encodeURIComponent(q)}` : ""));
      items = data.items;
      $("books").innerHTML = items.map((b) => `
        <div class="card bg-base-200 shadow">
          <div class="cover flex items-end rounded-t-box p-3" style="background:${b.color}"><span class="font-bold leading-tight text-white drop-shadow">${esc(b.title)}</span></div>
          <div class="card-body gap-1 p-3">
            <p class="text-xs opacity-70">${esc(b.author)}</p>
            <div class="flex items-center justify-between"><b>${money(b.price.amount)}</b>
              <span class="badge badge-sm ${b.availability === "in_stock" ? "badge-success" : b.availability === "low_stock" ? "badge-warning" : "badge-error"}">${b.availability.replace("_", " ")}</span></div>
            <button class="btn btn-primary btn-sm mt-1" data-add="${b.id}" ${b.availability === "out_of_stock" ? "disabled" : ""}>Add to cart</button>
          </div>
        </div>`).join("") || `<p class="opacity-60">No books found.</p>`;
    }

    function lineItemsPayload() {
      return session.line_items.map((l) => ({ id: l.id, item: { id: l.item.id }, quantity: l.quantity }));
    }

    async function addToCart(id) {
      if (!session) {
        const r = await api("POST", "/api/checkout-sessions", { line_items: [{ item: { id }, quantity: 1 }] });
        session = r.data;
      } else {
        const lines = lineItemsPayload();
        const existing = lines.find((l) => l.item.id === id);
        if (existing) existing.quantity++; else lines.push({ item: { id }, quantity: 1 });
        session = (await api("PUT", `/api/checkout-sessions/${session.id}`, { line_items: lines })).data;
      }
      renderCart();
      $("cart-modal").showModal();
    }

    async function setQty(id, delta) {
      const lines = lineItemsPayload().map((l) => (l.id === id ? { ...l, quantity: l.quantity + delta } : l)).filter((l) => l.quantity > 0);
      session = (await api("PUT", `/api/checkout-sessions/${session.id}`, { line_items: lines })).data;
      renderCart();
    }

    function renderCart() {
      $("cart-count").textContent = session ? session.line_items.reduce((n, l) => n + l.quantity, 0) : 0;
      const body = $("cart-body");
      if (last) {
        body.innerHTML = `<div class="alert alert-success"><div><p class="font-bold">Order ${esc(last.id)} confirmed 🎉</p><p class="text-sm">Total ${money(last.total.amount)} · shipping to ${esc(last.shipping_address.city)} · status: ${esc(last.fulfillment.status)}</p></div></div>
          <button id="new-order" class="btn btn-primary btn-sm mt-4">Continue shopping</button>`;
        return;
      }
      if (!session || !session.line_items.length) { body.innerHTML = `<p class="opacity-60">Your cart is empty.</p>`; return; }
      const total = (t) => session.totals.find((x) => x.type === t).amount;
      const errors = session.messages.filter((m) => m.type === "error");
      const f = session.fulfillment, b = session.buyer || {}, a = f.address || {};
      body.innerHTML = `
        <ul class="divide-y divide-base-content/10">${session.line_items.map((l) => `
          <li class="flex items-center justify-between py-2"><span>${esc(l.item.title)}</span>
            <span class="flex items-center gap-2"><button class="btn btn-xs" data-qty="${l.id}" data-d="-1">−</button>${l.quantity}<button class="btn btn-xs" data-qty="${l.id}" data-d="1">+</button><b class="w-20 text-right">${money(l.total)}</b></span></li>`).join("")}</ul>
        ${errors.map((m) => `<div class="alert alert-error mt-2 py-2 text-sm">${esc(m.content)}</div>`).join("")}
        <form id="checkout-form" class="mt-4 grid gap-2 sm:grid-cols-2">
          <input name="name" class="input input-bordered input-sm" placeholder="Full name" value="${esc(b.name)}" required>
          <input name="email" type="email" class="input input-bordered input-sm" placeholder="Email" value="${esc(b.email)}" required>
          <input name="street" class="input input-bordered input-sm sm:col-span-2" placeholder="Street address" value="${esc(a.street)}" required>
          <input name="city" class="input input-bordered input-sm" placeholder="City" value="${esc(a.city)}" required>
          <input name="postal_code" class="input input-bordered input-sm" placeholder="Postal code" value="${esc(a.postal_code)}" required>
          <select name="shipping" class="select select-bordered select-sm sm:col-span-2" required>
            <option value="">Shipping method…</option>
            ${f.options.map((o) => `<option value="${o.id}" ${f.selected_option_id === o.id ? "selected" : ""}>${esc(o.title)} — ${o.price ? money(o.price) : "free"}${o.free_over ? ` (free over ${money(o.free_over)})` : ""}</option>`).join("")}
          </select>
          <select name="token" class="select select-bordered select-sm sm:col-span-2">
            <option value="tok_success">Mock Pay: approve payment</option>
            <option value="tok_declined">Mock Pay: decline payment</option>
          </select>
          <button type="button" id="update" class="btn btn-outline btn-sm">Update totals</button>
          <button type="submit" class="btn btn-primary btn-sm" ${session.status === "ready_for_complete" ? "" : "disabled"}>Pay ${money(total("total"))}</button>
        </form>
        <dl class="mt-4 space-y-1 text-sm"><div class="flex justify-between"><dt>Subtotal</dt><dd>${money(total("subtotal"))}</dd></div>
          <div class="flex justify-between"><dt>Shipping</dt><dd>${money(total("shipping"))}</dd></div>
          <div class="flex justify-between"><dt>Tax</dt><dd>${money(total("tax"))}</dd></div>
          <div class="flex justify-between text-base font-bold"><dt>Total</dt><dd>${money(total("total"))}</dd></div></dl>
        <p class="mt-2 text-xs opacity-60">Session status: <b>${esc(session.status)}</b>${session.messages.filter((m) => m.type === "info").map((m) => ` · ${esc(m.content)}`).join("")}</p>
        <p id="pay-error" class="mt-2 text-sm text-error"></p>`;
    }

    function formUpdate() {
      const d = Object.fromEntries(new FormData($("checkout-form")));
      return { buyer: { name: d.name, email: d.email }, fulfillment: { address: { street: d.street, city: d.city, postal_code: d.postal_code }, selected_option_id: d.shipping || undefined } };
    }

    async function pushForm() {
      const r = await api("PUT", `/api/checkout-sessions/${session.id}`, formUpdate());
      if (r.ok) session = r.data;
      renderCart();
    }

    document.addEventListener("click", async (e) => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.dataset.add) addToCart(t.dataset.add);
      else if (t.dataset.qty) setQty(t.dataset.qty, Number(t.dataset.d));
      else if (t.id === "update") pushForm();
      else if (t.id === "new-order") { last = null; session = null; renderCart(); $("cart-modal").close(); loadBooks(); }
    });

    document.addEventListener("submit", async (e) => {
      if (e.target.id !== "checkout-form") return;
      e.preventDefault();
      const token = new FormData(e.target).get("token");
      await pushForm();
      if (session.status !== "ready_for_complete") return;
      const r = await api("POST", `/api/checkout-sessions/${session.id}/complete`, { payment: { handler_id: "mock_pay", token } });
      if (r.ok) { last = r.data.order; session = null; renderCart(); }
      else { renderCart(); $("pay-error").textContent = r.data.error.message; }
    });

    $("open-cart").addEventListener("click", () => { renderCart(); $("cart-modal").showModal(); });
    $("clear-log").addEventListener("click", () => ($("log").innerHTML = ""));
    let timer;
    $("search").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadBooks, 250); });
    api("GET", "/.well-known/ucp");
    loadBooks();
  </script>
</body>
</html>
